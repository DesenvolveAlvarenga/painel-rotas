<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rota do motorista</title>
<style>
:root{--bg:#eef1f3;--surface:#fff;--surface2:#f4f7f8;--ink:#12202b;--muted:#566673;--line:#d6dde2;--accent:#1456d6;--accent-ink:#fff;--good:#12834f;--alta:#d4351c;--warn:#a55a00;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#0e1720;--surface:#16222d;--surface2:#1b2a37;--ink:#e7eef3;--muted:#93a4b1;--line:#2a3b49;--accent:#6aa2ff;--accent-ink:#0b1722;--good:#46c488;--alta:#ff7b66;--warn:#f0b35a;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
main{max-width:560px;margin:0 auto;display:grid;gap:14px}
h1{font-size:20px;margin:0}
h2{font-size:17px;margin:0}
.muted{color:var(--muted);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px;min-width:0}
.big{font-size:22px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.btn{font:600 16px system-ui,sans-serif;min-height:48px;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;display:flex;align-items:center;justify-content:center;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.small{min-height:40px;padding:6px 12px;font-size:15px}
.btn[disabled]{opacity:.55}
.btn:focus-visible,input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{display:inline-block;font-size:13px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.chip.alta{color:var(--alta);border-color:currentColor}
.chip.ok{color:var(--good);border-color:currentColor}
.chip.warn{color:var(--warn);border-color:currentColor}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.gps{display:flex;align-items:center;gap:8px;font-size:14px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
.dot.on{background:var(--good)} .dot.err{background:var(--alta)}
#msg{font-size:14px;color:var(--warn)}
#msg:empty{display:none}
label{font-size:14px;font-weight:600;display:grid;gap:4px}
input,textarea{font:16px system-ui,sans-serif;width:100%;min-height:44px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-width:0}
textarea{min-height:64px;resize:vertical}
.stops{list-style:none;margin:0;padding:0;display:grid;gap:0}
.stop{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.stop:last-child{border-bottom:0}
.stop .n{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:700 13px system-ui,sans-serif;display:grid;place-items:center}
.stop.done .n{background:var(--muted)}
.stop.done .who{text-decoration:line-through;color:var(--muted)}
.who{font-weight:600;overflow-wrap:anywhere}
.addr{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.icon{min-width:44px;min-height:40px;padding:4px 10px;font-size:16px}
.code{font:600 13px ui-monospace,monospace;border:1px solid var(--line);border-radius:5px;padding:0 5px;margin-right:6px}
.results{display:grid;gap:6px}
.res{display:grid;gap:2px;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--ink);font:15px system-ui,sans-serif;cursor:pointer;width:100%}
.res[disabled]{opacity:.6;cursor:default}
.linkbtn{background:none;border:0;padding:6px 0;color:var(--accent);font:600 15px system-ui,sans-serif;cursor:pointer;text-align:left;justify-self:start}
.order{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:4px}
.order ul{margin:0;padding-left:18px;font-size:14px}
.order .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.tot{font-weight:700;font-variant-numeric:tabular-nums}
/* formulário de pedido */
dialog{border:0;border-radius:14px;padding:0;width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 24px);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog form{display:grid;gap:12px;padding:16px}
.item{display:grid;grid-template-columns:minmax(0,1fr) 72px 92px 40px;gap:6px;align-items:end}
.item .del{min-height:44px;background:none;border:1px solid var(--line);border-radius:8px;color:var(--muted);font-size:18px;cursor:pointer}
@media (max-width:420px){.item{grid-template-columns:minmax(0,1fr) 64px 84px 40px}}
.item label span{font-size:12px;font-weight:500;color:var(--muted)}
.sumline{display:flex;justify-content:space-between;align-items:center;font-size:17px}
</style>
</head>
<body>
<main>
  <header><h1 id="title">Rota do motorista</h1><p class="muted" id="sub">Carregando…</p></header>
  <section class="card">
    <div class="gps"><span class="dot" id="dot"></span><span id="gpstext">Localização não compartilhada</span></div>
    <button class="btn primary" id="btn-gps" type="button">Compartilhar minha localização</button>
    <p class="muted">Mantenha esta tela aberta durante a rota para o escritório acompanhar o veículo.</p>
    <p id="msg"></p>
  </section>
  <section id="next"></section>

  <section class="card" id="routebox" hidden>
    <h2>Minha rota</h2>
    <ul class="stops" id="list"></ul>
    <p class="muted" id="routehint"></p>
  </section>

  <section class="card" id="addbox" hidden>
    <h2>Adicionar cliente à rota</h2>
    <label>Código ou nome do cliente<input id="q" autocomplete="off" placeholder="Digite para buscar" enterkeyhint="search"></label>
    <div class="results" id="qres"></div>
    <button class="linkbtn" id="btn-new" type="button">Cliente sem cadastro? Informar nome e endereço</button>
    <div id="newbox" hidden style="display:grid;gap:10px">
      <label>Nome do cliente<input id="n-name" maxlength="120" autocomplete="off"></label>
      <label>Endereço<input id="n-addr" maxlength="300" autocomplete="off" placeholder="Rua, número, bairro, cidade"></label>
      <button class="btn primary" id="btn-addnew" type="button">Adicionar à rota</button>
    </div>
  </section>

  <section class="card" id="ordersbox" hidden>
    <h2>Pedidos lançados hoje</h2>
    <div id="orders" style="display:grid;gap:8px"></div>
    <div class="sumline"><span class="muted">Total do dia</span><span class="tot" id="ordtotal"></span></div>
  </section>
</main>

<dialog id="dlg" aria-labelledby="dlg-t">
  <form id="oform" method="dialog" autocomplete="off">
    <div><h2 id="dlg-t">Novo pedido</h2><p class="muted" id="dlg-client"></p></div>
    <div id="items" style="display:grid;gap:8px"></div>
    <button class="linkbtn" id="btn-item" type="button">+ Adicionar item</button>
    <label>Observação<textarea id="o-notes" maxlength="300" placeholder="Opcional: forma de pagamento, prazo de entrega…"></textarea></label>
    <div class="sumline"><span class="muted">Total</span><span class="tot" id="o-total">R$ 0,00</span></div>
    <p id="o-msg" style="color:var(--alta);margin:0;font-size:14px"></p>
    <div class="two"><button class="btn" type="button" id="btn-ocancel">Cancelar</button><button class="btn primary" type="submit" id="btn-osave">Salvar pedido</button></div>
  </form>
</dialog>

<script>
'use strict';
const $ = s => document.querySelector(s);
function h(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) { if (v == null || v === false) continue; if (k.startsWith('on')) n.addEventListener(k.slice(2), v); else if (k === 'class') n.className = v; else n.setAttribute(k, v === true ? '' : v); }
  for (const c of kids.flat()) { if (c == null || c === false) continue; n.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return n;
}
const token = location.pathname.split('/').pop();
const fmtMin = m => (m < 60 ? Math.round(m) + ' min' : Math.floor(m / 60) + ' h ' + String(Math.round(m % 60)).padStart(2, '0'));
const brl = n => n.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const fmtQty = n => n.toLocaleString('pt-BR', { maximumFractionDigits: 3 });
const hour = t => new Date(t).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
/* "1.234,50" → 1234.5 · "12,5" → 12.5 · "" → null */
function parseNum(s) {
  s = String(s || '').replace(/\s|R\$/g, '');
  if (!s) return null;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  const n = Number(s);
  return Number.isFinite(n) ? n : NaN;
}
let data = null, watchId = null, lastPos = null, lastSent = 0, sharing = false, wake = null;

async function call(path, body, method) {
  const r = await fetch('/api/driver/' + token + (path ? '/' + path : ''), body ? { method: method || 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : undefined);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Erro ' + r.status);
  return j;
}
const say = t => { $('#msg').textContent = t || ''; };
async function load() {
  try { data = await call(''); render(); }
  catch (e) { $('#sub').textContent = e.message; $('#next').replaceChildren(); ['#routebox', '#addbox', '#ordersbox'].forEach(s => { $(s).hidden = true; }); }
}
function ordersOf(stopId) { return data.orders.filter(o => o.stopId === stopId); }
function render() {
  const v = data.vehicle;
  $('#title').textContent = v.name + (v.plate ? ' · ' + v.plate : '');
  $('#sub').textContent = v.driver ? 'Motorista: ' + v.driver : 'Sua rota de hoje';
  $('#addbox').hidden = false;
  const pend = data.stops.filter(s => s.status === 'pendente'), done = data.stops.length - pend.length, box = $('#next');
  box.replaceChildren();
  if (!data.stops.length) box.append(h('div', { class: 'card' }, h('div', { class: 'big' }, 'Sem paradas por enquanto'), h('p', { class: 'muted' }, 'Adicione os clientes que vai visitar logo abaixo, ou aguarde o escritório gerar a rota.')));
  else if (!pend.length) box.append(h('div', { class: 'card' }, h('div', { class: 'big' }, 'Rota concluída'), h('p', { class: 'muted' }, done + ' de ' + data.stops.length + ' paradas feitas. Volte ao depósito.')));
  else {
    const s = pend[0], dest = s.lat + ',' + s.lng, n = ordersOf(s.id).length;
    box.append(h('div', { class: 'card' },
      h('span', { class: 'muted' }, 'Próxima parada · ' + (done + 1) + ' de ' + data.stops.length),
      h('div', { class: 'big' }, s.client), h('div', {}, s.address),
      s.notes ? h('div', { class: 'muted' }, 'Obs.: ' + s.notes) : null,
      h('div', { class: 'chips' }, s.priority === 'alta' ? h('span', { class: 'chip alta' }, 'Prioridade alta') : null,
        s.etaMin != null ? h('span', { class: 'chip' }, 'Chegada em cerca de ' + fmtMin(s.etaMin)) : null,
        s.geoStatus === 'pendente' ? h('span', { class: 'chip' }, 'Localizando endereço…') : null,
        n ? h('span', { class: 'chip ok' }, n + (n > 1 ? ' pedidos' : ' pedido')) : null),
      s.lat != null ? h('div', { class: 'two' },
        h('a', { class: 'btn', href: 'https://waze.com/ul?ll=' + dest + '&navigate=yes', target: '_blank', rel: 'noopener' }, 'Abrir no Waze'),
        h('a', { class: 'btn', href: 'https://www.google.com/maps/dir/?api=1&destination=' + dest + '&travelmode=driving', target: '_blank', rel: 'noopener' }, 'Google Maps')) : null,
      h('div', { class: 'two' },
        h('button', { class: 'btn', type: 'button', onclick: () => openOrder(s) }, 'Lançar pedido'),
        h('button', { class: 'btn primary', type: 'button', onclick: ev => deliver(s, ev.currentTarget) }, 'Entreguei'))));
  }
  renderRoute(); renderOrders();
}
function renderRoute() {
  const ul = $('#list'); ul.replaceChildren();
  $('#routebox').hidden = !data.stops.length;
  const pend = data.stops.filter(s => s.status === 'pendente');
  data.stops.forEach(s => {
    const done = s.status === 'entregue', pi = pend.indexOf(s), n = ordersOf(s.id).length;
    ul.append(h('li', { class: 'stop' + (done ? ' done' : '') },
      h('span', { class: 'n' }, done ? '✓' : s.order),
      h('div', {},
        h('div', { class: 'who' }, s.code ? h('span', { class: 'code' }, s.code) : null, s.client),
        h('div', { class: 'addr' }, s.address),
        (s.geoStatus !== 'ok' || n || (!done && s.etaMin != null)) ? h('div', { class: 'chips', style: 'margin-top:4px' },
          s.geoStatus === 'pendente' ? h('span', { class: 'chip' }, 'Localizando…') : null,
          s.geoStatus === 'falhou' ? h('span', { class: 'chip warn' }, 'Endereço não localizado no mapa') : null,
          !done && s.etaMin != null ? h('span', { class: 'chip' }, 'em ' + fmtMin(s.etaMin)) : null,
          n ? h('span', { class: 'chip ok' }, n + (n > 1 ? ' pedidos' : ' pedido')) : null) : null,
        h('div', { class: 'acts' },
          h('button', { class: 'btn small', type: 'button', onclick: () => openOrder(s) }, 'Pedido'),
          !done ? h('button', { class: 'btn small icon', type: 'button', 'aria-label': 'Subir ' + s.client, title: 'Subir', disabled: pi <= 0, onclick: ev => move(s, -1, ev.currentTarget) }, '↑') : null,
          !done ? h('button', { class: 'btn small icon', type: 'button', 'aria-label': 'Descer ' + s.client, title: 'Descer', disabled: pi >= pend.length - 1, onclick: ev => move(s, 1, ev.currentTarget) }, '↓') : null,
          !done && s.canRemove ? h('button', { class: 'btn small icon', type: 'button', 'aria-label': 'Tirar ' + s.client + ' da rota', title: 'Tirar da rota', onclick: ev => removeStop(s, ev.currentTarget) }, '×') : null))));
  });
  $('#routehint').textContent = pend.length > 1 ? 'Use ↑ e ↓ para mudar a ordem das visitas. A rota no mapa do escritório é refeita na hora.' : '';
}
function renderOrders() {
  const box = $('#orders'); box.replaceChildren();
  $('#ordersbox').hidden = !data.orders.length;
  let total = 0;
  for (const o of data.orders) {
    total += o.total;
    box.append(h('div', { class: 'order' },
      h('div', { class: 'top' }, h('b', {}, 'Nº ' + o.num + ' · ' + o.client), h('span', { class: 'tot' }, brl(o.total))),
      h('ul', {}, o.items.map(it => h('li', {}, fmtQty(it.qty) + (it.unit ? ' ' + it.unit : '') + ' × ' + it.desc + (it.price != null ? ' (' + brl(it.price) + ')' : '')))),
      o.notes ? h('div', { class: 'muted' }, 'Obs.: ' + o.notes) : null,
      h('div', { class: 'chips', style: 'align-items:center' },
        h('span', { class: 'chip' + (o.status === 'conferido' ? ' ok' : '') }, o.status === 'conferido' ? 'Conferido pelo escritório' : 'Enviado às ' + hour(o.createdAt)),
        o.status === 'novo' ? h('button', { class: 'linkbtn', type: 'button', style: 'padding:0 0 0 6px;font-size:14px', onclick: () => removeOrder(o) }, 'Cancelar pedido') : null)));
  }
  $('#ordtotal').textContent = brl(total);
}
async function deliver(s, btn) {
  btn.disabled = true;
  try { await call('deliver', { id: s.id }); say(''); await load(); } catch (e) { say(e.message); btn.disabled = false; }
}
async function move(s, dir, btn) {
  btn.disabled = true;
  try { await call('stop-move', { id: s.id, dir }); await load(); } catch (e) { say(e.message); btn.disabled = false; }
}
async function removeStop(s, btn) {
  if (!confirm('Tirar ' + s.client + ' da sua rota?')) return;
  btn.disabled = true;
  try { await call('stop-remove', { id: s.id }); await load(); } catch (e) { say(e.message); btn.disabled = false; }
}
async function removeOrder(o) {
  if (!confirm('Cancelar o pedido Nº ' + o.num + ' de ' + o.client + '?')) return;
  try { await call('order-remove', { id: o.id }); await load(); } catch (e) { say(e.message); }
}

/* ---------------- adicionar cliente à rota ---------------- */
let qTimer = null, qSeq = 0;
$('#q').addEventListener('input', () => {
  clearTimeout(qTimer);
  const q = $('#q').value.trim();
  if (!q) { $('#qres').replaceChildren(); return; }
  qTimer = setTimeout(async () => {
    const seq = ++qSeq;
    try {
      const { results } = await call('clients?q=' + encodeURIComponent(q));
      if (seq !== qSeq) return;
      const box = $('#qres'); box.replaceChildren();
      if (!results.length) { box.append(h('p', { class: 'muted' }, data && !data.hasClients ? 'O escritório ainda não cadastrou clientes. Use "Cliente sem cadastro" abaixo.' : 'Nenhum cliente com "' + q + '".')); return; }
      results.forEach(c => {
        const busy = c.inMyRoute || c.inOtherRoute;
        box.append(h('button', { class: 'res', type: 'button', disabled: busy, onclick: ev => addClient(c, ev.currentTarget) },
          h('span', { class: 'who' }, c.code ? h('span', { class: 'code' }, c.code) : null, c.name),
          h('span', { class: 'addr' }, c.address),
          busy ? h('span', { class: 'chip warn', style: 'justify-self:start' }, c.inMyRoute ? 'Já está na sua rota' : 'Na rota de outro veículo') : null));
      });
    } catch (e) { say(e.message); }
  }, 200);
});
async function addClient(c, btn) {
  btn.disabled = true;
  try {
    await call('stop', { clientId: c.id });
    $('#q').value = ''; $('#qres').replaceChildren(); say('');
    await load();
  } catch (e) { say(e.message); btn.disabled = false; }
}
$('#btn-new').addEventListener('click', () => { const b = $('#newbox'); b.hidden = !b.hidden; if (!b.hidden) $('#n-name').focus(); });
$('#btn-addnew').addEventListener('click', async () => {
  const client = $('#n-name').value.trim(), address = $('#n-addr').value.trim();
  if (!client || !address) { say('Informe o nome e o endereço do cliente.'); return; }
  const b = $('#btn-addnew'); b.disabled = true;
  try {
    await call('stop', { client, address });
    $('#n-name').value = ''; $('#n-addr').value = ''; $('#newbox').hidden = true; say('');
    await load();
  } catch (e) { say(e.message); } finally { b.disabled = false; }
});

/* ---------------- pedido ---------------- */
let orderStop = null;
function itemRow(focus) {
  const row = h('div', { class: 'item' },
    h('label', {}, h('span', {}, 'Produto'), h('input', { class: 'i-desc', maxlength: 120, placeholder: 'Ex.: Água 20 L' })),
    h('label', {}, h('span', {}, 'Qtd.'), h('input', { class: 'i-qty', inputmode: 'decimal', value: '1' })),
    h('label', {}, h('span', {}, 'Preço un.'), h('input', { class: 'i-price', inputmode: 'decimal', placeholder: '0,00' })),
    h('button', { class: 'del', type: 'button', 'aria-label': 'Remover item', onclick: () => { row.remove(); if (!$('#items').children.length) itemRow(true); updTotal(); } }, '×'));
  row.addEventListener('input', updTotal);
  $('#items').append(row);
  if (focus) row.querySelector('.i-desc').focus();
}
function readItems() {
  return [...document.querySelectorAll('#items .item')].map(r => ({ desc: r.querySelector('.i-desc').value.trim(), qty: parseNum(r.querySelector('.i-qty').value), price: parseNum(r.querySelector('.i-price').value) }))
    .filter(it => it.desc);
}
function updTotal() {
  const t = readItems().reduce((s, it) => s + (Number.isFinite(it.qty) && Number.isFinite(it.price) ? it.qty * it.price : 0), 0);
  $('#o-total').textContent = brl(t);
}
function openOrder(s) {
  orderStop = s;
  $('#dlg-client').textContent = s.client + ' · ' + s.address;
  $('#items').replaceChildren(); itemRow(false); $('#o-notes').value = ''; $('#o-msg').textContent = ''; updTotal();
  $('#dlg').showModal(); $('#items .i-desc').focus();
}
$('#btn-item').addEventListener('click', () => itemRow(true));
$('#btn-ocancel').addEventListener('click', () => $('#dlg').close());
$('#oform').addEventListener('submit', async e => {
  e.preventDefault();
  const items = readItems();
  if (!items.length) { $('#o-msg').textContent = 'Inclua ao menos um produto.'; return; }
  const bad = items.find(it => !(it.qty > 0) || Number.isNaN(it.price));
  if (bad) { $('#o-msg').textContent = 'Confira a quantidade e o preço de "' + bad.desc + '".'; return; }
  const b = $('#btn-osave'); b.disabled = true;
  try {
    const o = await call('order', { stopId: orderStop.id, items, notes: $('#o-notes').value.trim() });
    $('#dlg').close(); say('Pedido Nº ' + o.num + ' enviado ao escritório.');
    await load();
  } catch (err) { $('#o-msg').textContent = err.message; } finally { b.disabled = false; }
});

/* ---------------- GPS ---------------- */
function setGps(state, text) { $('#dot').className = 'dot ' + state; $('#gpstext').textContent = text; }
async function send() {
  if (!lastPos) return;
  try { await call('position', lastPos); lastSent = Date.now(); setGps('on', 'Localização enviada às ' + new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' })); }
  catch (e) { setGps('err', 'Não consegui enviar a localização. Tentando de novo…'); }
}
function startGps() {
  if (!navigator.geolocation) { say('Este navegador não oferece GPS.'); return; }
  sharing = true; $('#btn-gps').hidden = true; setGps('', 'Procurando sinal de GPS…');
  watchId = navigator.geolocation.watchPosition(p => {
    lastPos = { lat: p.coords.latitude, lng: p.coords.longitude };
    if (Date.now() - lastSent > 5000) send();
  }, err => {
    sharing = false; $('#btn-gps').hidden = false;
    setGps('err', err.code === 1 ? 'Permissão de localização negada.' : 'Sem sinal de GPS.');
    say(err.code === 1 ? 'Libere a localização para este site nas configurações do navegador e toque de novo no botão.' : 'Vá para um local aberto e tente de novo.');
  }, { enableHighAccuracy: true, maximumAge: 5000, timeout: 30000 });
  if (navigator.wakeLock) navigator.wakeLock.request('screen').then(l => { wake = l; }).catch(() => {});
}
$('#btn-gps').addEventListener('click', startGps);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && sharing && navigator.wakeLock) navigator.wakeLock.request('screen').then(l => { wake = l; }).catch(() => {}); });
setInterval(() => { if (sharing && lastPos && Date.now() - lastSent > 20000) send(); }, 5000);
setInterval(() => { if (!$('#dlg').open) load(); }, 20000);
load();
</script>
</body>
</html>
